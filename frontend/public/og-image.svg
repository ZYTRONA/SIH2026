<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090D16" />
      <stop offset="50%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#0D9488" />
    </linearGradient>
    <radialGradient id="radarGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.15" />
      <stop offset="70%" stop-color="#0284C7" stop-opacity="0.05" />
      <stop offset="100%" stop-color="transparent" />
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)" />

  <!-- Polar Radar Coordinate Rings in Background -->
  <g opacity="0.25" transform="translate(920, 315)">
    <circle r="260" fill="url(#radarGlow)" stroke="#38BDF8" stroke-width="1.5" stroke-dasharray="6,6" />
    <circle r="190" fill="none" stroke="#38BDF8" stroke-width="1.5" />
    <circle r="120" fill="none" stroke="#38BDF8" stroke-width="1.5" stroke-dasharray="4,4" />
    <circle r="50" fill="#38BDF8" fill-opacity="0.2" stroke="#38BDF8" stroke-width="2" />
    <line x1="-280" y1="0" x2="280" y2="0" stroke="#38BDF8" stroke-width="1" />
    <line x1="0" y1="-280" x2="0" y2="280" stroke="#38BDF8" stroke-width="1" />
    <polygon points="0,-15 12,15 -12,15" fill="#38BDF8" />
  </g>

  <!-- Content Container -->
  <g transform="translate(80, 80)">
    <!-- Compliance Badges Row -->
    <g transform="translate(0, 0)">
      <rect width="320" height="36" rx="18" fill="#0D9488" fill-opacity="0.2" stroke="#0D9488" stroke-width="1.5" />
      <text x="160" y="23" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="13" font-weight="800" fill="#2DD4BF" text-anchor="middle" letter-spacing="1.5">
        IMO POLAR CODE PC1–PC7 COMPLIANT
      </text>

      <rect x="335" y="0" width="240" height="36" rx="18" fill="#38BDF8" fill-opacity="0.15" stroke="#38BDF8" stroke-width="1.5" />
      <text x="455" y="23" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="13" font-weight="800" fill="#7DD3FC" text-anchor="middle" letter-spacing="1">
        POLAR MARITIME AI PLATFORM
      </text>
    </g>

    <!-- Main Title & Logo Icon -->
    <g transform="translate(0, 95)">
      <!-- Logo Mark -->
      <rect width="64" height="64" rx="18" fill="url(#accentGrad)" />
      <circle cx="32" cy="32" r="14" fill="none" stroke="#090D16" stroke-width="4" />
      <circle cx="32" cy="32" r="6" fill="#090D16" />
      <polygon points="32,10 38,22 26,22" fill="#090D16" />

      <!-- Title Text -->
      <text x="85" y="48" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="52" font-weight="900" fill="#FFFFFF" letter-spacing="-1">
        POLARIS <tspan fill="#38BDF8">AI</tspan>
      </text>
    </g>

    <!-- Subtitle / Tagline -->
    <text x="0" y="215" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="28" font-weight="800" fill="#F8FAFC">
      Polar Adaptive Route Intelligence System
    </text>

    <!-- Description Paragraph -->
    <text x="0" y="265" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="18" font-weight="500" fill="#94A3B8" width="650">
      <tspan x="0" dy="0">Autonomous decision support for Antarctic &amp; high-latitude maritime navigation.</tspan>
      <tspan x="0" dy="28">Fusing Copernicus SAR satellite radar, ResUNet sea-ice prediction, and</tspan>
      <tspan x="0" dy="28">Lagrangian iceberg drift modeling into Pareto-optimal passage corridors.</tspan>
    </text>

    <!-- Key Metrics Badges -->
    <g transform="translate(0, 390)">
      <!-- Box 1 -->
      <rect width="180" height="70" rx="14" fill="#1E293B" stroke="#334155" stroke-width="1.5" />
      <text x="20" y="28" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#64748B">FUEL REDUCTION</text>
      <text x="20" y="54" font-family="'JetBrains Mono', monospace" font-size="22" font-weight="900" fill="#34D399">+14.2% OPTIMAL</text>

      <!-- Box 2 -->
      <rect x="200" width="180" height="70" rx="14" fill="#1E293B" stroke="#334155" stroke-width="1.5" />
      <text x="220" y="28" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#64748B">RIO MARGIN</text>
      <text x="220" y="54" font-family="'JetBrains Mono', monospace" font-size="22" font-weight="900" fill="#38BDF8">+18 NOMINAL</text>

      <!-- Box 3 -->
      <rect x="400" width="220" height="70" rx="14" fill="#1E293B" stroke="#334155" stroke-width="1.5" />
      <text x="420" y="28" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#64748B">EDGE INFERENCE</text>
      <text x="420" y="54" font-family="'JetBrains Mono', monospace" font-size="22" font-weight="900" fill="#F8FAFC">JETSON AGX 48GB</text>
    </g>
  </g>
</svg>
