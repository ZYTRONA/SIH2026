services:
  # ---------------------------------------------------------------------------
  # POLARIS AI — FastAPI Python Backend Web Service
  # ---------------------------------------------------------------------------
  - type: web
    name: polaris-ai-backend
    runtime: python
    region: oregon
    plan: free
    buildCommand: pip install --upgrade pip && pip install -r backend/requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: ENVIRONMENT
        value: production
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: DATABASE_URL
        sync: false

  # ---------------------------------------------------------------------------
  # POLARIS AI — React/Vite Frontend Static Site
  # ---------------------------------------------------------------------------
  - type: web
    name: polaris-ai-frontend
    runtime: static
    region: oregon
    plan: free
    buildCommand: npm --prefix frontend install && npm --prefix frontend run build
    staticPublishPath: ./frontend/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: NODE_VERSION
        value: 20.18.0
      - key: VITE_API_URL
        fromService:
          type: web
          name: polaris-ai-backend
          property: host

